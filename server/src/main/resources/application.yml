spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/extension_blocker_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      mode: always
server:
  servlet:
    encoding:
      charset: UTF-8
